openapi: 3.2.0
info:
  title: Reference Accounts API
  version: 1.0.0
servers:
- url: https://host.com
  description: Default
tags:
- name: Accounts
paths:
  /v2/accounts/:
    get:
      operationId: get-all-bank-accounts
      summary: Get All Bank Accounts
      description: ''
      tags:
      - Accounts
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: search
        in: query
        description: A search term.
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounts_getAllBankAccounts_Response_200'
    post:
      operationId: create-consumer-bank-account
      summary: Create Consumer Bank Account
      tags:
      - Accounts
      parameters:
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountV2'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountCreateV2'
  /v2/accounts/{account_id}/:
    get:
      operationId: get-bank-account
      summary: Get Bank Account
      description: ''
      tags:
      - Accounts
      parameters:
      - name: account_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountV2'
    put:
      operationId: update-bank-account
      summary: Update Bank Account
      description: ''
      tags:
      - Accounts
      parameters:
      - name: account_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountUpdateV2'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountUpdateV2'
components:
  schemas:
    BankAccountCreateV2:
      type: object
      properties:
        consumer_id:
          type: string
        routing_number:
          type: string
        account_number:
          type: string
        bank_name:
          type: string
        account_name:
          type: string
        plaid_account_id:
          type:
          - string
          - 'null'
        plaid_access_token:
          type:
          - string
          - 'null'
      required:
      - consumer_id
      - routing_number
      - account_number
      - bank_name
      - account_name
      title: BankAccountCreateV2
    BankAccountV2:
      type: object
      properties:
        id:
          type: string
        consumer_id:
          type: string
        bank_name:
          type:
          - string
          - 'null'
        balance:
          type: string
        account_name:
          type: string
        account_type:
          type: string
        account_number:
          type: string
        account_routing_number:
          type: string
        is_primary:
          type: boolean
        is_active:
          type: boolean
          default: true
      required:
      - bank_name
      - account_name
      - account_type
      - is_primary
      title: BankAccountV2
    Accounts_getAllBankAccounts_Response_200:
      type: object
      properties:
        count:
          type: integer
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/BankAccountV2'
      required:
      - count
      - results
      title: Accounts_getAllBankAccounts_Response_200
    BankAccountUpdateV2:
      type: object
      properties:
        routing_number:
          type: string
        account_number:
          type: string
        bank_name:
          type: string
        account_name:
          type: string
        is_active:
          type: boolean
      title: BankAccountUpdateV2
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
