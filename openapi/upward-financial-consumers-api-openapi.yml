        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumers_listTransferResponses_Response_200'
components:
  schemas:
    UpdateConsumer:
      type: object
      properties:
        pcid:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
        date_of_birth:
          type: string
          format: date
        address_line1:
          type: string
        address_line2:
          type: string
        address_city:
          type: string
        address_state:
          type: string
        address_zip:
          type: string
      title: UpdateConsumer
    NewConsumer:
      type: object
      properties:
        pcid:
          type: string
        email:
          type: string
          format: email
        external_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        date_of_birth:
          type: string
          format: date
        tax_identifier:
          type: string
        address_line1:
          type: string
        address_line2:
          type: string
        address_city:
          type: string
        address_state:
          type: string
        address_zip:
          type: string
      required:
      - pcid
      - email
      title: NewConsumer
    BankAccountV2:
      type: object
      properties:
        id:
          type: string
        consumer_id:
          type: string
        bank_name:
          type:
          - string
          - 'null'
        balance:
          type: string
        account_name:
          type: string
        account_type:
          type: string
        account_number:
          type: string
        account_routing_number:
          type: string
        is_primary:
          type: boolean
        is_active:
          type: boolean
          default: true
      required:
      - bank_name
      - account_name
      - account_type
      - is_primary
      title: BankAccountV2
    Consumers_getConsumerBankAccounts_Response_200:
      type: object
      properties:
        count:
          type: integer
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/BankAccountV2'
      required:
      - count
      - results
      title: Consumers_getConsumerBankAccounts_Response_200
    GetUserInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        consumer_id:
          type: string
          format: uuid
        invite_code:
          type: string
        claimed:
          type: boolean
        claimed_date:
          type:
          - string
          - 'null'
          format: date-time
        expiration_date:
          type: string
          format: date-time
      required:
      - id
      - consumer_id
      title: GetUserInvitation
    Consumers_listConsumerDisputes_Response_200:
      type: object
      properties:
        count:
          type: integer
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/ConsumerDispute'
      required:
      - count
      - results
      title: Consumers_listConsumerDisputes_Response_200
    CreateUserInvitation:
      type: object
      properties:
        expiration_date:
          type: string
          format: date-time
      required:
      - expiration_date
      title: CreateUserInvitation
    Consumers_listConsumerACHPayments_Response_200:
      type: object
      properties:
        count:
          type: integer
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            description: Any type
      required:
      - count
      - results
      title: Consumers_listConsumerACHPayments_Response_200
