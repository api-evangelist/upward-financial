                $ref: '#/components/schemas/Consumers_listConsumerPaymentCards_Response_200'
  /v2/consumers/:
    get:
      operationId: list-consumers
      summary: List Consumers
      description: Get all consumers
      tags:
      - consumers
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: search
        in: query
        description: A search term.
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumers_listConsumers_Response_200'
    post:
      operationId: create-new-consumer
      summary: Create New Consumer
      description: Create a new Consumer if one does not exist for the given partner and pc_id
      tags:
      - consumers
      parameters:
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewConsumer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConsumer'
  /v2/consumers/{consumer_id}/:
    get:
      operationId: retrieve-consumer
      summary: Retrieve Consumer
      description: Get the consumer data from the consumer_id provided by the partner
      tags:
      - consumers
      parameters:
      - name: consumer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConsumer'
    put:
      operationId: update-consumer
      summary: Update Consumer
      description: PUT method to update consumer's data
      tags:
      - consumers
      parameters:
      - name: consumer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateConsumer'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConsumer'
  /v2/consumers/pcid/{consumer_pc_id}/:
    get:
      operationId: get-consumers-by-pcid
      summary: Get Consumers By PCID
      description: Get Consumer by PCID
      tags:
      - consumers
      parameters:
      - name: consumer_pc_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConsumer'
  /v2/consumers/{consumer_id}/addresses/:
    get:
      operationId: list-consumer-addresses-v-2
      summary: List Consumer Addresses V 2
      description: Retrieves a list of addresses for the consumer.
      tags:
      - consumers
      parameters:
      - name: consumer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: search
        in: query
        description: A search term.
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumers_ListConsumerAddressesV2_Response_200'
    post:
      operationId: create-address-v-2
      summary: Create Address V 2
      description: Create a new address for the consumer. Billing addresses cannot be created manually.
      tags:
      - consumers
      parameters:
      - name: consumer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
  /v2/consumers/{consumer_id}/addresses/{address_id}/:
    get:
      operationId: retrieve-address-v-2
      summary: Retrieve Address V 2
      description: Retrieves an address.
      tags:
      - consumers
      parameters:
      - name: consumer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: address_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
    put:
      operationId: update-address-v-2
      summary: Update Address V 2
      description: Update an existing address. Billing addresses cannot be edited or transformed into billing.
      tags:
      - consumers
      parameters:
      - name: consumer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: address_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
    delete:
      operationId: delete-address-v-2
      summary: Delete Address V 2
      description: Delete an address. Billing addresses cannot be deleted.
      tags:
      - consumers
      parameters:
      - name: consumer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: address_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumers_DeleteAddressV2_Response_204'
  /v2/consumers/{consumer_id}/invites/:
    get:
      operationId: list-consumer-invites
