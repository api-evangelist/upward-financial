openapi: 3.1.0
info:
  title: API Reference accounts consumers API
  version: 1.0.0
servers:
- url: https://host.com
  description: Default
tags:
- name: consumers
paths:
  /v2/consumers/{consumer_id}/dispute/list/:
    get:
      operationId: list-consumer-disputes
      summary: List Consumer Disputes
      description: ''
      tags:
      - consumers
      parameters:
      - name: consumer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        schema:
          type: integer
      - name: search
        in: query
        description: A search term.
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumers_listConsumerDisputes_Response_200'
  /v2/consumers/{consumer_id}/accounts/:
    get:
      operationId: get-consumer-bank-accounts
      summary: Get Consumer Bank Accounts
      description: ''
      tags:
      - consumers
      parameters:
      - name: consumer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        schema:
          type: integer
      - name: search
        in: query
        description: A search term.
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumers_getConsumerBankAccounts_Response_200'
  /v2/consumers/{consumer_id}/payment-cards/:
    get:
      operationId: list-consumer-payment-cards
      summary: List Consumer Payment Cards
      description: ''
      tags:
      - consumers
      parameters:
      - name: consumer_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: search
        in: query
        description: A search term.
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
