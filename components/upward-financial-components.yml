description: >-
  Upward (Upwardli) ships embeddable, consumer-facing UI components as a
  first-class integration path alongside its REST API. The components are
  cross-platform and designed to be hosted inside any embedded web view; all
  of them use the Upward API layer for data. Client-side auth uses the
  down-scoped token from the RFC 8693 token-exchange flow with the
  ui:client-onboarding scope.
