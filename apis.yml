aid: upward-financial
name: Upward Financial
description: >-
  Upward Financial (Upwardli) is a Techstars-backed embedded-finance platform
  that lets banks, fintechs, and gig platforms launch credit products for
  their customers without building the stack themselves. Its Credit Suite API
  and embeddable UI components cover credit builder cards and credit lines,
  bill payments and bureau bill reporting, direct payouts, money movement
  (ACH, AFT/OCT, instant, P2P, book transfers), cashback rewards, statements,
  and credit insights, with OAuth 2.0 machine-to-machine auth, RFC 8693
  token exchange for consumer-scoped client tokens, an HMAC-signed webhook
  event catalog, an isolated sandbox with reserved SSN test cases and
  transaction simulators, a published OpenAPI 3.1, llms.txt, and a hosted
  docs MCP server.
